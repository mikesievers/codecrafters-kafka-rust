[package]
name = "codecrafters-kafka"
version = "0.1.0"
authors = [
    "Codecrafters <hello@codecrafters.io>",
    "Michael Sievers <michael@hamburg.de>",
]
edition = "2024"
rust-version = "1.96"

[dependencies]
anyhow = "1.0.68" # error handling
futures-util = { version = "0.3.31", features = [
    "sink",
] } # SinkExt for FramedWrite::send
bytes = "1.3.0" # helps manage buffers
thiserror = "1.0.38" # error handling
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
